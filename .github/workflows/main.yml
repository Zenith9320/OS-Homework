name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Rust toolchain
      run: |
        rustup set profile minimal
        rustup toolchain install nightly-2020-06-04 --component rustfmt --component clippy
        rustup override set nightly-2020-06-04
    - name: Check code format
      run: cd kernel && cargo fmt -- --check

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13]
        # we will bring back mipsel later
        arch: [x86_64, riscv32, riscv64, aarch64, mipsel]
    steps:
    - uses: actions/checkout@v2
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install Rust toolchain
      run: |
        rustup set profile minimal
        rustup toolchain install nightly-2020-06-04 --component rust-src --component llvm-tools-preview
        rustup override set nightly-2020-06-04

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt install -y device-tree-compiler libglib2.0-dev pkg-config libpixman-1-dev
    - name: Install dependencies
      if: runner.os == 'macOS'
      run: brew install dtc

    - name: Cache QEMU
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: qemu-4.2.0
        key: ${{ runner.os }}-${{ matrix.arch }}-qemu
    - name: Install QEMU
      if: runner.os == 'Linux'
      run: |
        [ ! -d qemu-4.2.0 ] && wget https://download.qemu.org/qemu-4.2.0.tar.xz && tar xJf qemu-4.2.0.tar.xz > /dev/null
        cd qemu-4.2.0 && ./configure --target-list=${{ matrix.arch }}-softmmu && sudo make install -j $(nproc) && cd ..
    - name: Install QEMU
      if: runner.os == 'macOS'
      run: brew install qemu

    - name: Download prebuilt user image
      run: cd user && make sfsimg ARCH=${{ matrix.arch }} PREBUILT=1 && cd ..

    - name: Build kernel
      run: cd kernel && make build ARCH=${{ matrix.arch }} && cd ..
    - name: Build kernel with hypervisor
      if: runner.os == 'Linux' && matrix.arch == 'x86_64'
      run: cd kernel && make build ARCH=${{ matrix.arch }} HYPERVISOR=on && cd ..
