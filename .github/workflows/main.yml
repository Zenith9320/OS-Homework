name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2020-06-04
        components: rustfmt, clippy
    - name: Install rustfmt
      run: rustup component add rustfmt --toolchain nightly-2020-06-04
    - name: Check code format
      run: cd kernel && cargo fmt -- --check

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # we will bring back mipsel later
        arch: [x86_64, riscv32, riscv64, aarch64, mipsel]
    steps:
    - uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install rcore-fs-fuse
      run: |
        rm -rf ~/.cargo/git/db/rcore-fs-* || true
        cargo install rcore-fs-fuse --git https://github.com/rcore-os/rcore-fs --rev 7f5eeac --force || \
        cargo install rcore-fs-fuse --git https://github.com/rcore-os/rcore-fs --rev 7f5eeac --force

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2020-06-04
        components: rust-src, llvm-tools-preview

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y device-tree-compiler qemu-system-x86 qemu-system-arm qemu-system-misc qemu-system-mips
    - name: Install QEMU
      if: runner.os == 'macOS'
      run: brew install qemu

    - name: Install dependencies
      if: runner.os == 'macOS'
      run: brew install dtc

    - name: Download prebuilt user image
      run: cd user && make sfsimg ARCH=${{ matrix.arch }} PREBUILT=1 && cd ..

    - name: Build kernel
      run: cd kernel && make build ARCH=${{ matrix.arch }} && cd ..
    - name: Build kernel with hypervisor
      if: runner.os == 'Linux' && matrix.arch == 'x86_64'
      run: cd kernel && make build ARCH=${{ matrix.arch }} HYPERVISOR=on && cd ..
